[project]
name = "rendez"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "django>=5.2,<5.3", "djangorestframework>=3.16,<3.17",
  "drf-spectacular>=0.28,<0.29", "psycopg[binary]>=3.2,<3.3",
  "pillow>=11.3,<12", "gunicorn>=23,<24"
]
[dependency-groups]
dev = ["pytest>=8.4,<9", "pytest-django>=4.11,<5", "ruff>=0.12,<0.13"]
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["."]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
