components:
  schemas:
    AttributeEvidence:
      type: object
      properties:
        attribute:
          $ref: '#/components/schemas/VisualAttribute'
        photo_ids:
          type: array
          items:
            type: string
            format: uuid
      required:
      - attribute
      - photo_ids
    Category:
      type: object
      properties:
        slug:
          type: string
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          maxLength: 100
      required:
      - name
      - slug
    ConsentVersionEnum:
      enum:
      - photo-rights-v2
      type: string
      description: '* `photo-rights-v2` - photo-rights-v2'
    ContentReport:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        reason:
          $ref: '#/components/schemas/ReasonEnum'
        note:
          type: string
          maxLength: 1000
        status:
          allOf:
          - $ref: '#/components/schemas/ContentReportStatusEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - reason
      - status
    ContentReportRequest:
      type: object
      properties:
        reason:
          $ref: '#/components/schemas/ReasonEnum'
        note:
          type: string
          maxLength: 1000
      required:
      - reason
    ContentReportStatusEnum:
      enum:
      - pending
      - resolved
      type: string
      description: |-
        * `pending` - Chờ xử lý
        * `resolved` - Đã xử lý
    FeedItem:
      type: object
      properties:
        photo:
          $ref: '#/components/schemas/PublicPhoto'
        place:
          $ref: '#/components/schemas/VisualPlace'
      required:
      - photo
      - place
    GalleryPage:
      type: object
      properties:
        count:
          type: integer
        next:
          type: string
          nullable: true
        previous:
          type: string
          nullable: true
        results:
          type: array
          items:
            $ref: '#/components/schemas/PublicPhoto'
      required:
      - count
      - next
      - previous
      - results
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 4096
      required:
      - email
      - password
    OpeningHours:
      type: object
      properties:
        text:
          type: string
        source:
          type: string
        verified_at:
          type: string
          format: date-time
      required:
      - source
      - text
      - verified_at
    PaginatedFeedItemList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/FeedItem'
    PaginatedPhotoCommentList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/PhotoComment'
    PaginatedPhotoSubmissionList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/PhotoSubmission'
    PaginatedPublicPhotoList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/PublicPhoto'
    PaginatedVisualPlaceList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/VisualPlace'
    PasswordChangeRequest:
      type: object
      properties:
        current_password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 4096
        new_password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 4096
      required:
      - current_password
      - new_password
    PatchedCaptionRequest:
      type: object
      properties:
        caption:
          type: string
          maxLength: 1000
    PatchedProfileUpdateRequest:
      type: object
