# nginx cho FE RendeZ (container `web`).
# - Static SPA: fallback mọi route về index.html (react-router).
# - "/api": reverse proxy sang service `api` của compose — cùng origin với FE
#   nên không cần CORS, cookie auth (withCredentials) vẫn đi bình thường.

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Cache bất biến cho asset có hash (Vite sinh tên file kèm hash).
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # API → backend container (tên service trong compose network).
  location /api/ {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SPA fallback: route không khớp file tĩnh → index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
