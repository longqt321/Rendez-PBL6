# nginx cho FE RendeZ (container `web`).
# - Static SPA: fallback mọi route về index.html (react-router).
# - "/api": reverse proxy sang service `api` của compose — cùng origin với FE
#   nên không cần CORS, cookie auth (withCredentials) vẫn đi bình thường.
# - "/discover/:id", "/post/:id": bot preview mạng xã hội (UA sniff) nhận HTML
#   meta động từ API; người dùng thường vẫn nhận SPA tĩnh như cũ.

# Bot preview mạng xã hội — danh sách ngắn, chỉ các bot fetch link khi share.
# meta-externalagent/validator: crawler Meta (Threads/FB) 2024+.
# File này được include trong `http` context (conf.d) nên `map`/`proxy_cache_path`
# đặt ngoài `server` là hợp lệ.
map $http_user_agent $is_og_bot {
  default                   0;
  ~*facebookexternalhit     1;
  ~*^Facebot                1;
  ~*facebookcatalog         1;
  ~*meta-externalagent      1;
  ~*meta-externalvalidator  1;
  ~*Zalo                    1;
  ~*Twitterbot              1;
  ~*slack                   1;
  ~*WhatsApp                1;
  ~*TelegramBot             1;
  ~*discordapp              1;
  ~*LinkedInBot             1;
}

# Cache HTML bot: 10 phút cho 200, 1 phút cho 404 — bot cùng link không chạm API.
proxy_cache_path /var/cache/nginx/og levels=1:2 keys_zone=og_cache:1m
                 max_size=20m inactive=1h use_temp_path=off;

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Cache bất biến cho asset có hash (Vite sinh tên file kèm hash).
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Bot preview cho trang quán — đặt TRƯỚC regex phần mở rộng tĩnh bên dưới để
  # `/discover/abc.html` cũng đi đúng nhánh. `if` + `return` là pattern an toàn
  # của nginx ("if is evil" chỉ cấm đặt proxy_pass/rewrite phức tạp trong if).
  location ~ ^/discover/(?<og_place_id>[^/]+)$ {
    if ($is_og_bot) { return 418; }
    try_files $uri /index.html;
    error_page 418 = @og_place;
  }

  location @og_place {
    # `rewrite` + `proxy_pass` KHÔNG kèm URI: host `api` phân giải lúc khởi động
    # (không cần `resolver` như khi proxy_pass chứa biến).
    rewrite ^ /api/v1/og/place/$og_place_id break;
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache og_cache;
    proxy_cache_key "$scheme$host$request_uri";
    proxy_cache_valid 200 10m;
    proxy_cache_valid 404 1m;
    # API chết → trả index.html tĩnh (preview mặc định) thay vì 502.
    proxy_intercept_errors on;
    error_page 500 502 503 504 = @spa_fallback;
  }

  # Bot preview cho bài đăng — cùng cơ chế, tiền tố khác.
  location ~ ^/post/(?<og_post_id>[^/]+)$ {
    if ($is_og_bot) { return 418; }
    try_files $uri /index.html;
    error_page 418 = @og_post;
  }

  location @og_post {
    rewrite ^ /api/v1/og/post/$og_post_id break;
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache og_cache;
    proxy_cache_key "$scheme$host$request_uri";
    proxy_cache_valid 200 10m;
    proxy_cache_valid 404 1m;
    proxy_intercept_errors on;
    error_page 500 502 503 504 = @spa_fallback;
  }

  location @spa_fallback {
    try_files /index.html =500;
  }

  # File có phần mở rộng tĩnh: KHÔNG fallback về index.html — thiếu file
  # phải trả 404 thật (tránh soft-404: /robots.txt, /manifest.json… bị
  # nuốt trả 200 text/html). Regex location ưu tiên hơn `location /`.
  location ~* \.(js|mjs|css|map|json|webmanifest|txt|xml|html?|png|jpe?g|gif|svg|webp|avif|ico|bmp|woff2?|ttf|otf|eot)$ {
    try_files $uri =404;
  }

  # API → backend container (tên service trong compose network).
  location /api/ {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SSE (`/api/v1/notifications/events`, `/api/v1/rooms/:code/events`): tắt
  # buffer để event nhỏ tới client ngay, không bị nginx giữ lại. Khai riêng vì
  # `proxy_buffering off` áp cho mọi response của location /api/ là không cần.
  location ~ ^/api/v1/(notifications|rooms/[^/]+)/events$ {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 24h;
  }

  # SPA fallback: route không khớp file tĩnh → index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
