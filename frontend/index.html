<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Rendez — khám phá Đà Nẵng qua trải nghiệm của cộng đồng: địa điểm thật, ảnh thật, gợi ý thật."
    />
    <meta name="theme-color" content="#f7f6f1" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" />
    <title>Rendez · Khám phá Đà Nẵng</title>
    <script>
      // Resolve the theme before the first paint so the page never flashes the
      // wrong palette. Keep in sync with src/lib/theme.tsx.
      (function () {
        try {
          var stored = localStorage.getItem("rendez-theme");
          var dark =
            stored === "dark" ||
            ((!stored || stored === "system") &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
        } catch (error) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
