name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      # Lockfile nằm ở workspace root → cài ở root, kiểm tra ở frontend/
      - name: Cài dependency
        working-directory: .
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Kiểm tra kiểu
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Kiểm tra format
        run: bun run format:check

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

  # Backend: test integration dùng Testcontainers nên cần Docker của runner
  # (ubuntu-latest có sẵn) — không cần service postgres riêng.
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Cài dependency
        working-directory: .
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Sinh Prisma client
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
        run: bunx prisma@7.10.1 generate

      - name: Kiểm tra kiểu
        run: bun run typecheck

      - name: Kiểm tra format
        working-directory: .
        run: bunx prettier@3.10.1 --check "backend/**/*.{ts,json}"

      # Tuần tự: mỗi file test dựng container Postgres riêng.
      - name: Test
        run: bun test --parallel=1

  # Cấu hình deploy: chỉ kiểm cú pháp compose (không chạy container thật).
  deploy-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Kiểm tra compose production
        env:
          BETTER_AUTH_SECRET: ci-placeholder-secret
          BETTER_AUTH_URL: https://ci.example.com
          CORS_ORIGINS: https://ci.example.com
          POSTGRES_PASSWORD: ci-placeholder
        run: docker compose -f compose.yaml -f deploy/compose.prod.yml config > /dev/null

      - name: Kiểm tra script backup (shellcheck nếu có, else bash -n)
        run: |
          if command -v shellcheck > /dev/null; then
            shellcheck deploy/backup-db.sh
          else
            bash -n deploy/backup-db.sh
          fi

  # E2E với mock in-memory — phủ luồng UI không cần backend thật.
  e2e-mock:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Cài dependency
        working-directory: .
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Cài trình duyệt Playwright
        run: bunx playwright@1.65.0 install --with-deps chromium

      - name: E2E (mock)
        run: bun run e2e --project=mock
