name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cài dependency
        run: bun install --frozen-lockfile

      - name: Kiểm tra kiểu
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Kiểm tra format
        run: bun run format:check

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build
