name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # Lockfile nằm ở workspace root → cài ở root, kiểm tra ở frontend/
      - name: Cài dependency
        working-directory: .
        run: bun install --frozen-lockfile

      - name: Kiểm tra kiểu
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Kiểm tra format
        run: bun run format:check

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

  # Backend: test integration dùng Testcontainers nên cần Docker của runner
  # (ubuntu-latest có sẵn) — không cần service postgres riêng.
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cài dependency
        working-directory: .
        run: bun install --frozen-lockfile

      - name: Sinh Prisma client
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
        run: bunx prisma generate

      - name: Kiểm tra kiểu
        run: bun run typecheck

      - name: Kiểm tra format
        working-directory: .
        run: bunx prettier --check "backend/**/*.{ts,json}"

      # Tuần tự: mỗi file test dựng container Postgres riêng.
      - name: Test
        run: bun test --parallel=1
