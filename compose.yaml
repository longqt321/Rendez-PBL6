# Dev local: chỉ Postgres. API chạy bằng `bun run dev:api` (không container hoá khi dev).
# Chạy full-stack prod-like: `docker compose up -d --build` (postgres + migrate + api + web).
# Mật khẩu dưới đây là mặc định DEV, override bằng biến môi trường nếu cần.
services:
  postgres:
    image: postgres:17-alpine
    container_name: rendez-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rendez}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rendez_dev}
      POSTGRES_DB: ${POSTGRES_DB:-rendez}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rendez} -d ${POSTGRES_DB:-rendez}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Chạy migration một lần rồi thoát; API chờ service này xong mới khởi động.
  migrate:
    image: rendez-api-migrator
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: migrator
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-rendez}:${POSTGRES_PASSWORD:-rendez_dev}@postgres:5432/${POSTGRES_DB:-rendez}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: rendez-api
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    container_name: rendez-api
    environment:
      # Mặc định development để chạy demo local với secret dev. Production PHẢI
      # đặt NODE_ENV=production + BETTER_AUTH_SECRET riêng (env.ts từ chối
      # secret dev khi NODE_ENV=production).
      NODE_ENV: ${NODE_ENV:-development}
      PORT: "8000"
      DATABASE_URL: postgresql://${POSTGRES_USER:-rendez}:${POSTGRES_PASSWORD:-rendez_dev}@postgres:5432/${POSTGRES_DB:-rendez}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-rendez-dev-secret-0123456789abcdef}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:8000}
      # Origin FE được phép gọi — cần cho CORS và cho better-auth kiểm `redirectTo`
      # của link reset mật khẩu (thiếu → 403 khi FE gọi từ origin khác).
      # 5199 là cổng dev server E2E (playwright webServer).
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:5199}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # FE production-like: nginx phục vụ static + proxy "/api" → service `api`.
  # Port host mặc định 5173 (trùng port dev server Vite — không chạy cả hai cùng lúc).
  web:
    image: rendez-web
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: rendez-web
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
