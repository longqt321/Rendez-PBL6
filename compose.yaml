name: rendez-v2-specs

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rendez}
      POSTGRES_USER: ${POSTGRES_USER:-rendez}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rendez-local}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - rendez_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  rendez_db:
