# Dev local: chỉ Postgres. API chạy bằng `bun run dev:api` (không container hoá khi dev).
# Chạy full-stack prod-like: `docker compose up -d --build` (postgres + migrate + api + web).
# Mật khẩu dưới đây là mặc định DEV, override bằng biến môi trường nếu cần.
services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17
    container_name: rendez-postgres
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - shared_buffers=384MB
      - -c
      - effective_cache_size=1024MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - random_page_cost=1.1
      - -c
      - max_connections=100
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rendez}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rendez_dev}
      POSTGRES_DB: ${POSTGRES_DB:-rendez}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata2:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: '3.5'
          memory: 1536M
        reservations:
          cpus: '0.5'
          memory: 384M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rendez} -d ${POSTGRES_DB:-rendez}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: rendez-redis
    command:
      - redis-server
      - --maxmemory
      - 192mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
      - --appendonly
      - "no"
    ports:
      - "${REDIS_PORT:-6379}:6379"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Chạy migration một lần rồi thoát; API chờ service này xong mới khởi động.
  migrate:
    image: rendez-api-migrator
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: migrator
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-rendez}:${POSTGRES_PASSWORD:-rendez_dev}@postgres:5432/${POSTGRES_DB:-rendez}
      SEED_MODE: ${SEED_MODE:-dev}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: rendez-api
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    container_name: rendez-api
    # Nạp thêm biến từ backend/.env nếu có (R2_*, LOG_LEVEL...) — file thiếu
    # thì bỏ qua. Các biến khai rõ ở `environment` dưới đây luôn thắng.
    env_file:
      - path: backend/.env
        required: false
    environment:
      # Mặc định development để chạy demo local với secret dev. Production PHẢI
      # đặt NODE_ENV=production + BETTER_AUTH_SECRET riêng (env.ts từ chối
      # secret dev khi NODE_ENV=production).
      NODE_ENV: ${NODE_ENV:-development}
      DEMO_AUTO_VERIFY_EMAIL: ${DEMO_AUTO_VERIFY_EMAIL:-true}
      PORT: "8000"
      DATABASE_URL: postgresql://${POSTGRES_USER:-rendez}:${POSTGRES_PASSWORD:-rendez_dev}@postgres:5432/${POSTGRES_DB:-rendez}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-rendez-dev-secret-0123456789abcdef}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:8000}
      # Origin FE được phép gọi — cần cho CORS và cho better-auth kiểm `redirectTo`
      # của link reset mật khẩu (thiếu → 403 khi FE gọi từ origin khác).
      # 5199 là cổng dev server E2E (playwright webServer).
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,https://localhost:5173,http://localhost:5199}
      # Origin FE công khai — dùng để dựng og:url/og:image tuyệt đối cho HTML bot.
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:5173}
      # Trong compose, API luôn đứng sau reverse proxy (service `web`/Caddy) trên
      # mạng nội bộ — phải tin các IP đó thì rate limit mới thấy IP người dùng
      # thật thay vì IP của proxy (mặc định rỗng = gộp mọi user vào một bucket).
      # 172.16.0.0/12 là dải mạng bridge mặc định của Docker.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.16.0.0/12}
      REDIS_URL: redis://redis:6379
    ports:
      - "${API_PORT:-8000}:8000"
    deploy:
      resources:
        limits:
          cpus: '5.0'
          memory: 2944M
        reservations:
          cpus: '0.5'
          memory: 512M
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # FE production-like: nginx phục vụ static + proxy "/api" → service `api`.
  # Port host mặc định 5173 (trùng port dev server Vite — không chạy cả hai cùng lúc).
  web:
    image: rendez-web
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Origin công khai cho canonical/og + robots.txt/sitemap.xml lúc build.
        VITE_APP_ORIGIN: ${APP_ORIGIN:-}
    container_name: rendez-web
    ports:
      - "${WEB_PORT:-5173}:443"
    volumes:
      - ./deploy/certs:/etc/nginx/certs:ro
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    depends_on:
      api:
        condition: service_healthy

  # Postgres bench — DB riêng cho benchmark dataset chuẩn (Yelp Open Dataset),
  # KHÔNG đè dữ liệu Đà Nẵng. Chỉ bật khi chạy benchmark:
  #   docker compose --profile bench up -d postgres-bench
  # Port 5434 trên host để không đụng postgres chính (5432).
  postgres-bench:
    image: pgvector/pgvector:0.8.7-pg17
    container_name: rendez-postgres-bench
    profiles: ["bench"]
    environment:
      POSTGRES_USER: rendez
      POSTGRES_PASSWORD: rendez
      POSTGRES_DB: rendez
    ports:
      - "5434:5432"
    volumes:
      - pgdata-bench:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 512M

volumes:
  # `pgdata` là volume cũ (postgres:17-alpine) — giữ tên để rollback thủ công,
  # không service nào dùng; dữ liệu đã migrate sang `pgdata2` (pgvector) qua
  # pg_dump/restore, xem docs/DECISIONS.md.
  pgdata:
  pgdata2:
  # Volume riêng của DB bench — xoá được mà không ảnh hưởng dữ liệu production.
  pgdata-bench:
